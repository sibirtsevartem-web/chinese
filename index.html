<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>买菜 - Китайский рынок</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a100c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .market-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      background: url('map.png') no-repeat center center;
      background-size: contain;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .player-profile {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      color: #fff;
      backdrop-filter: blur(4px);
    }

    .stats-group {
      display: flex;
      gap: 8px;
    }

    .stat-badge {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 6px 10px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .shop-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 12px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.01);
    }

    .shop-hotspot:active {
      transform: translate(-50%, -50%) scale(0.95);
      border-color: #ffb703;
      background: rgba(255, 183, 3, 0.2);
    }

    #shop-vegetables { top: 32%; left: 30%; width: 14%; height: 12%; }
    #shop-fruits     { top: 32%; left: 64%; width: 14%; height: 12%; }
    #shop-meat       { top: 54%; left: 23%; width: 14%; height: 12%; }
    #shop-seafood    { top: 62%; left: 74%; width: 14%; height: 12%; }
    #shop-center     { top: 50%; left: 48%; width: 16%; height: 14%; }
    #shop-snacks     { top: 76%; left: 18%; width: 13%; height: 12%; }
    #shop-home       { top: 76%; left: 36%; width: 13%; height: 12%; }
    #shop-clothes    { top: 76%; left: 61%; width: 13%; height: 12%; }

    .bottom-nav {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .nav-btn {
      background: linear-gradient(180deg, #2b2b2b 0%, #111111 100%);
      color: #fff;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .nav-btn:active {
      background: #444;
    }
  </style>
</head>
<body>

  <div class="market-container">
    <div class="top-bar">
      <div class="player-profile">
        <span>Артём • Уровень 3</span>
      </div>
      <div class="stats-group">
        <div class="stat-badge">🪙 48</div>
        <div class="stat-badge">🔥 5</div>
      </div>
    </div>

    <div class="shop-hotspot" id="shop-vegetables" onclick="openShop('Овощи')"></div>
    <div class="shop-hotspot" id="shop-fruits" onclick="openShop('Фрукты')"></div>
    <div class="shop-hotspot" id="shop-meat" onclick="openShop('Мясо')"></div>
    <div class="shop-hotspot" id="shop-seafood" onclick="openShop('Морепродукты')"></div>
    <div class="shop-hotspot" id="shop-center" onclick="openShop('Главная площадь')"></div>
    <div class="shop-hotspot" id="shop-snacks" onclick="openShop('Закуски')"></div>
    <div class="shop-hotspot" id="shop-home" onclick="openShop('Товары для дома')"></div>
    <div class="shop-hotspot" id="shop-clothes" onclick="openShop('Одежда')"></div>

    <div class="bottom-nav">
      <button class="nav-btn" onclick="alert('Мой прогресс')">🗺️ Мой прогресс</button>
      <button class="nav-btn" onclick="alert('Задания дня')">📜 Задания дня</button>
      <button class="nav-btn" onclick="alert('Достижения')">🧩 Достижения</button>
    </div>
  </div>

  <script>
    function openShop(name) {
      alert('Переход в зону: ' + name);
    }
  </script>
</body>
</html>
